name: Build HUNTERICE ABYSS VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release
  PLUGIN_NAME: "HUNTERICE ABYSS"

jobs:
  build-windows:
    name: Build VST3 on Windows x64
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache CMake dependencies
      uses: actions/cache@v4
      with:
        path: |
          build/_deps
          ~/.cache/CMake
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Configure CMake with Ninja
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      shell: pwsh

    - name: Build project
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      shell: pwsh

    - name: Find and verify VST3 file
      run: |
        Write-Host "Searching for VST3 file..."
        $vst3Path = Get-ChildItem -Path build -Recurse -Filter "*.vst3" | Select-Object -First 1
        if ($vst3Path) {
          Write-Host "✓ VST3 file found: $($vst3Path.FullName)"
          Write-Host "✓ File size: $($vst3Path.Length) bytes"
          Write-Host "VST3_PATH=$($vst3Path.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Error "✗ VST3 file not found!"
          Get-ChildItem -Path build -Recurse | Select-Object FullName
          exit 1
        }
      shell: pwsh

    - name: Prepare artifact
      run: |
        New-Item -ItemType Directory -Force -Path "artifacts"
        Copy-Item -Path "$env:VST3_PATH" -Destination "artifacts" -Recurse
        Write-Host "✓ VST3 copied to artifacts directory"
      shell: pwsh

    - name: Create ZIP archive
      working-directory: artifacts
      run: |
        $zipName = "HUNTERICE-ABYSS-VST3-Windows-x64.zip"
        Compress-Archive -Path "*.vst3" -DestinationPath $zipName -Force
        Write-Host "✓ Created ZIP: $zipName"
        Write-Host "✓ ZIP size: $((Get-Item $zipName).Length) bytes"
      shell: pwsh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HUNTERICE-ABYSS-VST3-Windows-x64
        path: artifacts/*.zip
        retention-days: 30
        if-no-files-found: error

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log
          build/**/*.log
        retention-days: 7

    - name: Build summary
      if: success()
      run: |
        Write-Host "=========================================="
        Write-Host "✓ BUILD SUCCESSFUL"
        Write-Host "=========================================="
        Write-Host "Plugin: ${{ env.PLUGIN_NAME }}"
        Write-Host "Platform: Windows x64"
        Write-Host "Configuration: ${{ env.BUILD_TYPE }}"
        Write-Host "Format: VST3"
        Write-Host "=========================================="
        Write-Host "✓ Artifact uploaded successfully"
        Write-Host "✓ Download from: Actions tab -> Artifacts"
        Write-Host "=========================================="
      shell: pwsh
